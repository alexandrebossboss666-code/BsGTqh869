<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recevoir mon code — Mode expert</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{
    font-family:'Inter',sans-serif;
    max-width:420px;
    margin:60px auto;
    padding:0 20px;
    color:#26261f;
  }
  h1{ font-size:1.3rem; }
  input{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid #9b9b96;
    margin-bottom:14px;
    font-size:0.95rem;
    box-sizing:border-box;
  }
  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#FFBA6B;
    font-weight:700;
    cursor:pointer;
    font-size:0.95rem;
  }
  button:hover{ background:#e8a04f; }
  button:disabled{ background:#c7c7c4; color:#6b6b67; cursor:not-allowed; }
  #msg{
    margin-top:16px;
    font-size:0.9rem;
    font-weight:600;
  }
  #msg.error{ color:#c0342c; }
  #msg.success{ color:#3f7a2b; }
  .note{
    background:#f2f2ef;
    padding:12px 14px;
    border-radius:8px;
    font-size:0.82rem;
    color:#6b6b67;
    margin-bottom:20px;
    line-height:1.4;
  }
  .condition-status{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:0.84rem;
    font-weight:600;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:20px;
    line-height:1.4;
  }
  .condition-status.ok{
    background:#e3f3da;
    color:#153c0c;
  }
  .condition-status.ko{
    background:#f8dcdc;
    color:#5c1414;
  }
  .check-icon, .cross-icon{
    display:inline-block;
    width:16px;
    height:16px;
    position:relative;
    flex-shrink:0;
    margin-top:2px;
  }
  .check-icon::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:5px; height:9px;
    border-right:2.5px solid #3f7a2b;
    border-bottom:2.5px solid #3f7a2b;
    transform:rotate(45deg);
  }
  .cross-icon::before, .cross-icon::after{
    content:'';
    position:absolute;
    left:2px; top:7px;
    width:12px;
    height:2.5px;
    background:#5c1414;
    border-radius:2px;
  }
  .cross-icon::before{ transform:rotate(45deg); }
  .cross-icon::after{ transform:rotate(-45deg); }
</style>
</head>
<body>
  <h1>Reçois ton code du mode expert</h1>
  <div id="conditionStatus"></div>
  <p class="note">
    Entre ton adresse email pour recevoir ton code à 6 chiffres.
    Il sera valable 10 minutes et utilisable une seule fois sur le site du test de réflexion.
  </p>
  <input type="email" id="emailInput" placeholder="Ton adresse email">
  <button id="sendBtn">Recevoir mon code</button>
  <p id="msg"></p>

<script>
  /* ===================== CONFIG EmailJS ===================== */
  const EMAILJS_PUBLIC_KEY  = 'bjtrhwEcD5a0TvA-p';
  const EMAILJS_SERVICE_ID  = 'service_6up8bo9';
  const EMAILJS_TEMPLATE_ID = 'template_ukv7jwf';
  /* ============================================================ */

  /* ===================== CONFIG Supabase (mêmes valeurs que test-de-reflexion.html) ===================== */
  const SUPABASE_URL = 'https://alrcdwhyrgqqrfyxqklg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_AXSZBIjcBZbAVosgFccfYQ_dUVhaXa0';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  /* ======================================================================================================= */

  emailjs.init(EMAILJS_PUBLIC_KEY);

  function generatePin(len = 6){
    let code = '';
    for(let i = 0; i < len; i++){
      code += Math.floor(Math.random() * 10);
    }
    return code;
  }

  function isValidEmailFormat(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  /* ===================== Condition d'accès : 3 badges Extra en mode normal sur test-de-reflexion.html ===================== */
  const TRIPLE_EXTRA_KEY = 'reflexion_triple_extra_normal';
  const conditionMet = localStorage.getItem(TRIPLE_EXTRA_KEY) === 'true';
  const conditionStatus = document.getElementById('conditionStatus');

  if(conditionMet){
    conditionStatus.className = 'condition-status ok';
    conditionStatus.innerHTML = `<span class="check-icon"></span><span>Condition validée : tu as obtenu le badge Extra dans les 3 catégories (logos, couleurs, notes) en mode normal.</span>`;
  } else {
    conditionStatus.className = 'condition-status ko';
    conditionStatus.innerHTML = `<span class="cross-icon"></span><span>Tu dois d'abord obtenir le badge Extra dans les 3 catégories (logos, couleurs, notes) en mode normal sur le test de réflexion.</span>`;
  }

  const EXPERT_CODE_REQUESTED_AT_KEY = 'expert_code_requested_at';
  const EXPERT_PENDING_CODE_KEY = 'expert_pending_code';
  const CODE_VALID_MS = 10 * 60 * 1000;

  const msg = document.getElementById('msg');
  const sendBtn = document.getElementById('sendBtn');
  const emailInput = document.getElementById('emailInput');

  function lockForm(message){
    emailInput.disabled = true;
    sendBtn.disabled = true;
    msg.className = 'success';
    msg.textContent = message;
  }

  function unlockForm(message){
    emailInput.disabled = false;
    sendBtn.disabled = false;
    msg.className = '';
    msg.textContent = message || '';
  }

  async function checkPendingCodeStatus(){
    const requestedAt = localStorage.getItem(EXPERT_CODE_REQUESTED_AT_KEY);
    const pendingCode = localStorage.getItem(EXPERT_PENDING_CODE_KEY);
    if(!requestedAt) return;

    // Verrouillage immédiat par précaution, avant même de savoir si la connexion fonctionne
    lockForm('Vérification…');

    // Le code a-t-il déjà été utilisé (validé sur test-de-reflexion.html) ?
    let usedStatus = null; // null = impossible à vérifier (pas de connexion)
    try{
      const { data, error } = await sb.from('expert_codes').select('used').eq('code', pendingCode).maybeSingle();
      if(!error){
        usedStatus = data ? !!data.used : false;
      }
    } catch(e){
      usedStatus = null;
    }

    if(usedStatus === true){
      lockForm('Ton code a déjà été utilisé, le mode expert est débloqué.');
      return;
    }

    if(usedStatus === null){
      // Pas de connexion : impossible de vérifier, on reste verrouillé par précaution plutôt que de déverrouiller à tort
      lockForm('Connexion impossible pour vérifier ton code. Réessaie avec une connexion internet active.');
      setTimeout(checkPendingCodeStatus, 15000);
      return;
    }

    const elapsed = Date.now() - new Date(requestedAt).getTime();
    const remaining = CODE_VALID_MS - elapsed;

    if(remaining > 0){
      lockForm('Code envoyé ! Vérifie ta boîte mail (valable 10 minutes).');
      setTimeout(checkPendingCodeStatus, remaining + 500);
    } else {
      localStorage.removeItem(EXPERT_CODE_REQUESTED_AT_KEY);
      localStorage.removeItem(EXPERT_PENDING_CODE_KEY);
      unlockForm('Ton précédent code a expiré, tu peux en redemander un.');
    }
  }

  if(!conditionMet){
    emailInput.disabled = true;
    sendBtn.disabled = true;
  } else {
    checkPendingCodeStatus();
  }

  sendBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    msg.className = '';
    if(!email){
      msg.textContent = 'Entre une adresse email.';
      msg.classList.add('error');
      return;
    }
    if(!isValidEmailFormat(email)){
      msg.textContent = 'Adresse email invalide (vérifie qu\'il y a bien un @ et un domaine, ex : nom@exemple.fr).';
      msg.classList.add('error');
      return;
    }

    sendBtn.disabled = true;
    emailInput.disabled = true;
    msg.textContent = 'Envoi en cours…';
    const code = generatePin();

    try{
      const { error: insertError } = await sb.from('expert_codes').insert([{
        email: email,
        code: code,
        used: false
      }]);
      if(insertError){
        msg.textContent = 'Erreur : ' + insertError.message;
        msg.classList.add('error');
        sendBtn.disabled = false;
        emailInput.disabled = false;
        return;
      }

      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        email: email,
        code: code
      });

      localStorage.setItem(EXPERT_CODE_REQUESTED_AT_KEY, new Date().toISOString());
      localStorage.setItem(EXPERT_PENDING_CODE_KEY, code);
      lockForm('Code envoyé ! Vérifie ta boîte mail (valable 10 minutes).');
      setTimeout(checkPendingCodeStatus, CODE_VALID_MS + 500);
    } catch(err){
      console.error(err);
      msg.textContent = 'Erreur : ' + (err.text || err.message || 'inconnue');
      msg.classList.add('error');
      sendBtn.disabled = false;
      emailInput.disabled = false;
    }
  });
</script>
</body>
</html>
